[package]
name = "picosigner-qr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
default = ["embedded"]
embedded = ["dep:quircs"]
host = []

[dependencies]
heapless = { version = "0.8.0", default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
minicbor = { version = "0.19.1", default-features = false, features = ["alloc"] }
quircs = { package = "quircs-nostd", path = "../quircs", optional = true }
ur = { version = "0.4.1", default-features = false }

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
