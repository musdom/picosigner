[package]
name = "picosigner-board"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
default = ["embedded"]
embedded = [
    "dep:embedded-graphics",
    "dep:embedded-hal",
    "dep:rp235x-hal",
    "dep:critical-section",
]
host = []

[dependencies]
embedded-graphics = { version = "0.8.1", default-features = false, optional = true }
embedded-hal = { version = "1.0.0", default-features = false, optional = true }
rand_core = { version = "0.9.3", default-features = false }
rp235x-hal = { version = "0.4.0", default-features = false, features = ["critical-section-impl"], optional = true }
critical-section = { version = "1.2.0", default-features = false, optional = true }
