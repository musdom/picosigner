[workspace]
members = [
    "picosigner",
    "picosigner-board",
    "picosigner-ui",
    "picosigner-qr",
    "picosigner-wallet",
    "quircs",
]
default-members = ["picosigner"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
