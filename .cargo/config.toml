[alias]
build-arm = "build --target=thumbv8m.main-none-eabihf"
run-arm = "run --target=thumbv8m.main-none-eabihf"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
# Cargo's release profile otherwise makes the cc crate compile libsecp256k1
# with GCC -O3. Its Cortex-M build produced input-dependent invalid BIP340
# signatures even though the same keypair passed all public-key checks.
# Upstream libsecp256k1's normal optimized build uses -O2.
CFLAGS_thumbv8m_main_none_eabihf = "-O2"

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "target-cpu=cortex-m33",
]
runner = "picotool load -u -v -x -t elf"
