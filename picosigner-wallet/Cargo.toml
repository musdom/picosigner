[package]
name = "picosigner-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
default = ["embedded"]
embedded = ["dep:bitcoin", "dep:bip39", "dep:schnorr_fun", "dep:sha2", "dep:zeroize"]
host = ["embedded", "dep:bdk_wallet", "bdk_wallet/std", "bitcoin/serde"]
debug = []

[dependencies]
bdk_wallet = { version = "3.1.0", default-features = false, optional = true }
bitcoin = { version = "0.32.8", default-features = false, features = ["secp-lowmemory"], optional = true }
bip39 = { version = "2.2.2", default-features = false, features = ["alloc"], optional = true }
miniscript = { version = "12.3.7", default-features = false, features = ["no-std"] }
schnorr_fun = { version = "0.13.0", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"], optional = true }
